name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@953c51da7e4c2c681f15c70513cb803c8fa461cc # v0.44.3
    with:
      image: 'ghcr.io/radiorabe/roundcubemail'
      name: roundcubemail
      display-name: Roundcube Mail
      tags: 'rabe roundcubemail'
      cosign-verify: false
      cosign-base-image-only: true
