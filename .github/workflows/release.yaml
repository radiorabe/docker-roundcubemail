name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  release-container:
    uses: radiorabe/actions/.github/workflows/release-container.yaml@5dafb461cea1f8b296d89297dc6de7bd0891f0d2 # v0.44.2
    with:
      image: 'ghcr.io/radiorabe/roundcubemail'
      name: roundcubemail
      display-name: Roundcube Mail
      tags: 'rabe roundcubemail'
      cosign-verify: false
      cosign-base-image-only: true
